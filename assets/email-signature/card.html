<style>
*{box-sizing:border-box;margin:0;padding:0} html,body{background:transparent}
body{font-family:'DM Sans',system-ui,sans-serif;display:inline-block;padding:14px}
.sig{background:#131316;border:1px solid rgba(196,23,106,.26);border-radius:12px;padding:16px 20px;display:flex;align-items:center;gap:18px;width:540px;position:relative;overflow:hidden}
.sig::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 200px 110px at -20px -20px,rgba(196,23,106,.12),transparent 70%)}
.ring{flex-shrink:0;width:68px;height:68px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#C4176A,#72B830)}
.ring div{width:100%;height:100%;border-radius:50%;overflow:hidden} .ring img{width:100%;height:100%;object-fit:cover;display:block}
.div{width:1px;height:66px;flex-shrink:0;opacity:.5;background:linear-gradient(to bottom,transparent,#C4176A 30%,#C4176A 70%,transparent)}
.c{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.n{font-family:'Cormorant Garamond',Georgia,serif;font-size:16px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:#F0EEF5;white-space:nowrap}
.t{font-size:10.5px;color:#C4176A;letter-spacing:.03em}
.what{font-size:10px;font-weight:500;color:#C9C6D0;letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.what b{color:#72B830;font-weight:500;padding:0 4px}
.l{display:flex;gap:14px;margin-top:6px} .l span{font-size:10.5px;color:#8A8890;display:flex;align-items:center;gap:5px}
.lg{flex-shrink:0;display:flex;flex-direction:column;align-items:center} .lg img{height:48px;filter:drop-shadow(0 0 7px rgba(196,23,106,.3))}
.lg span{font-size:7px;letter-spacing:.2em;color:#8A8890;margin-top:5px}
