<html lang="es">
<head>
<meta charset="UTF-8">
  <meta name="copyright" content="© Pittahaya. Todos los derechos reservados." />
  <meta name="rights" content="Diseño, textos, demos, marca, imágenes y experiencia digital protegidos por derechos de autor. Prohibida su reproducción o uso no autorizado." />
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Pittahaya CRM · Lead</title>
<script src="https://unpkg.com/@supabase/supabase-js@2.119.0/dist/umd/supabase.js" integrity="sha384-uteMfOloLDGt042uDz+xHGF3ym63/WQ6rFq7murQRG8Ih7QrXGEGNtWd8688sb4O" crossorigin="anonymous"></script>
<script src="/crm/demo-data.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #c9943a; --gold-light: #e8c97a; --gold-dim: rgba(201,148,58,0.15);
    --onyx: #0d0d0d; --onyx-2: #111111; --onyx-3: #1a1a1a; --onyx-4: #222222;
    --ash: #888888; --ash-light: #bbb; --border: rgba(255,255,255,0.07); --border-gold: rgba(201,148,58,0.25);
  }

  body { font-family: 'Montserrat', sans-serif; background: var(--onyx); color: #e5e5e5; font-size: 13px; }

  /* Sidebar (same as dashboard) */
  .sidebar {
    position: fixed; top: 0; left: 0; width: 220px; height: 100vh;
    background: var(--onyx-2); border-right: 1px solid var(--border-gold);
    display: flex; flex-direction: column; z-index: 100; padding: 0 0 24px;
  }
  .sidebar-brand { padding: 28px 24px 20px; border-bottom: 1px solid var(--border); }
  .sidebar-logo { font-family: 'Cormorant Garamond', serif; font-size: 22px; font-weight: 300; color: var(--gold-light); letter-spacing: 0.15em; }
  .sidebar-crm-label { font-size: 9px; letter-spacing: 0.3em; color: var(--ash); margin-top: 4px; text-transform: uppercase; }
  .sidebar-nav { flex: 1; padding: 24px 0; }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 10px 24px;
    color: var(--ash); text-decoration: none; font-size: 12px; font-weight: 400;
    letter-spacing: 0.05em; transition: all 0.2s; border-left: 2px solid transparent;
  }
  .nav-item:hover { color: var(--gold-light); border-left-color: var(--gold); background: rgba(201,148,58,0.05); }
  .nav-item svg { opacity: 0.7; flex-shrink: 0; }
  .sidebar-footer { padding: 16px 24px 0; border-top: 1px solid var(--border); }
  .btn-logout { width: 100%; padding: 10px; background: transparent; border: 1px solid var(--border); color: var(--ash); font-family: 'Montserrat', sans-serif; font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 1px; }
  .btn-logout:hover { border-color: var(--border-gold); color: var(--gold-light); }

  /* Main */
  .main { margin-left: 220px; padding: 32px 36px; min-height: 100vh; }

  .page-header {
    display: flex; align-items: flex-start; justify-content: space-between;
    margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border);
  }

  .back-link { display: flex; align-items: center; gap: 6px; color: var(--ash); text-decoration: none; font-size: 11px; letter-spacing: 0.05em; margin-bottom: 12px; transition: color 0.2s; }
  .back-link:hover { color: var(--gold); }

  .lead-name-header { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; color: #fff; letter-spacing: 0.05em; }
  .lead-meta-header { font-size: 12px; color: var(--ash); margin-top: 6px; display: flex; gap: 16px; flex-wrap: wrap; }
  .lead-meta-header span { display: flex; align-items: center; gap: 4px; }

  .header-actions { display: flex; gap: 10px; align-items: flex-start; padding-top: 36px; }

  .btn { padding: 9px 18px; border: 1px solid var(--border-gold); background: transparent; color: var(--gold); font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 1px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; }
  .btn:hover { background: var(--gold-dim); }
  .btn-danger { border-color: rgba(239,68,68,0.4); color: #f87171; }
  .btn-danger:hover { background: rgba(239,68,68,0.12); }

  /* Layout */
  .lead-grid { display: grid; grid-template-columns: 1fr 380px; gap: 24px; }

  /* Cards */
  .card {
    background: var(--onyx-3); border: 1px solid var(--border); border-radius: 2px;
    padding: 24px; margin-bottom: 20px;
  }
  .card-title { font-size: 9px; letter-spacing: 0.25em; color: var(--ash); text-transform: uppercase; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }

  .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .info-item label { font-size: 9px; letter-spacing: 0.15em; color: var(--ash); text-transform: uppercase; display: block; margin-bottom: 4px; }
  .info-item .val { font-size: 13px; color: #e5e5e5; word-break: break-word; }
  .info-item .val a { color: var(--gold); text-decoration: none; }
  .info-item .val a:hover { text-decoration: underline; }

  .message-box { background: var(--onyx-4); border-left: 2px solid var(--gold-dim); padding: 16px; border-radius: 1px; font-size: 13px; line-height: 1.7; color: var(--ash-light); white-space: pre-wrap; }

  /* Status & priority selects */
  select {
    background: var(--onyx-4); border: 1px solid var(--border); color: #e5e5e5;
    font-family: 'Montserrat', sans-serif; font-size: 12px; padding: 9px 12px;
    border-radius: 1px; outline: none; transition: border-color 0.2s; width: 100%;
  }
  select:focus { border-color: var(--border-gold); }
  select option { background: var(--onyx-3); }

  .select-row { display: flex; gap: 12px; }
  .select-group { flex: 1; }
  .select-group label { font-size: 9px; letter-spacing: 0.15em; color: var(--ash); text-transform: uppercase; display: block; margin-bottom: 6px; }

  .save-btn {
    width: 100%; margin-top: 14px; padding: 12px;
    background: transparent; border: 1px solid var(--gold); color: var(--gold-light);
    font-family: 'Montserrat', sans-serif; font-size: 10px; font-weight: 500;
    letter-spacing: 0.2em; text-transform: uppercase; cursor: pointer; transition: all 0.2s; border-radius: 1px;
  }
  .save-btn:hover { background: var(--gold-dim); }
  .save-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Badges */
  .badge { display: inline-block; padding: 3px 8px; border-radius: 1px; font-size: 9px; letter-spacing: 0.1em; font-weight: 600; text-transform: uppercase; }
  .badge-new       { background:rgba(59,130,246,0.15); color:#60a5fa; }
  .badge-contacted { background:rgba(139,92,246,0.15); color:#a78bfa; }
  .badge-qualified { background:rgba(245,158,11,0.15); color:#fbbf24; }
  .badge-proposal  { background:rgba(249,115,22,0.15); color:#fb923c; }
  .badge-proposal_sent { background:rgba(249,115,22,0.15); color:#fb923c; }
  .badge-won       { background:rgba(16,185,129,0.15); color:#34d399; }
  .badge-lost      { background:rgba(239,68,68,0.15); color:#f87171; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .dot-hot  { background:#ef4444; box-shadow:0 0 6px rgba(239,68,68,0.5); }
  .dot-warm { background:#f59e0b; }
  .dot-cold { background:#60a5fa; }

  /* Notes */
  .note-item { padding: 14px 0; border-bottom: 1px solid var(--border); }
  .note-item:last-child { border-bottom: none; }
  .note-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .note-author { font-size: 11px; font-weight: 500; color: var(--gold-light); }
  .note-date { font-size: 10px; color: var(--ash); }
  .note-content { font-size: 13px; color: var(--ash-light); line-height: 1.6; white-space: pre-wrap; }
  .note-delete { background: none; border: none; color: #555; cursor: pointer; font-size: 11px; transition: color 0.2s; padding: 2px 6px; }
  .note-delete:hover { color: #ef4444; }

  textarea {
    width: 100%; background: var(--onyx-4); border: 1px solid var(--border); color: #e5e5e5;
    font-family: 'Montserrat', sans-serif; font-size: 13px; padding: 12px; border-radius: 1px;
    outline: none; resize: vertical; min-height: 80px; transition: border-color 0.2s; line-height: 1.6;
  }
  textarea:focus { border-color: var(--border-gold); }
  textarea::placeholder { color: #444; }

  /* Tasks */
  .task-item { display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .task-item:last-child { border-bottom: none; }
  .task-check { width: 16px; height: 16px; accent-color: var(--gold); flex-shrink: 0; margin-top: 2px; cursor: pointer; }
  .task-body { flex: 1; }
  .task-title { font-size: 13px; color: #e5e5e5; }
  .task-title.done { text-decoration: line-through; color: var(--ash); }
  .task-due { font-size: 11px; color: var(--ash); margin-top: 2px; }
  .task-due.overdue { color: #f87171; }
  .task-delete { background: none; border: none; color: #555; cursor: pointer; font-size: 11px; transition: color 0.2s; padding: 2px 4px; }
  .task-delete:hover { color: #ef4444; }

  input[type="text"], input[type="date"], input[type="number"] {
    background: var(--onyx-4); border: 1px solid var(--border); color: #e5e5e5;
    font-family: 'Montserrat', sans-serif; font-size: 13px; padding: 9px 12px;
    border-radius: 1px; outline: none; transition: border-color 0.2s; width: 100%; box-sizing: border-box;
  }
  .stage-bar { display: flex; gap: 4px; margin: 4px 0 12px; }
  .stage-bar span { flex: 1; height: 4px; border-radius: 2px; background: var(--onyx-4); }
  .stage-bar span.on { background: var(--gold); }
  input:focus { border-color: var(--border-gold); }

  .add-row { display: flex; gap: 8px; margin-top: 12px; }
  .add-row input[type="text"] { flex: 1; }
  .add-row input[type="date"] { width: 140px; }
  .add-btn { padding: 9px 16px; background: transparent; border: 1px solid var(--border-gold); color: var(--gold); font-family: 'Montserrat', sans-serif; font-size: 11px; letter-spacing: 0.1em; cursor: pointer; transition: all 0.2s; border-radius: 1px; white-space: nowrap; }
  .add-btn:hover { background: var(--gold-dim); }

  .empty-state { font-size: 12px; color: var(--ash); padding: 12px 0; font-style: italic; }

  .toast {
    position: fixed; bottom: 24px; right: 24px;
    background: var(--onyx-3); border: 1px solid var(--border-gold);
    color: var(--gold-light); padding: 12px 20px; border-radius: 2px;
    font-size: 12px; letter-spacing: 0.05em;
    transform: translateY(80px); opacity: 0; transition: all 0.3s; z-index: 999;
  }
  .toast.show { transform: translateY(0); opacity: 1; }

  /* ── Documentos del cliente (bóveda) ── */
  .vault-badge { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; color: #8ee6bf; border: 1px solid rgba(52,211,153,.35); border-radius: 20px; padding: 2px 8px; }
  .file-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .fchip { background: var(--onyx-3); border: 1px solid var(--border); color: var(--ash-light); border-radius: 20px; padding: 4px 10px; font-size: 11px; cursor: pointer; font-family: inherit; display: inline-flex; gap: 5px; align-items: center; }
  .fchip.on { border-color: rgba(201,148,58,.5); color: var(--gold-light); background: rgba(201,148,58,.08); }
  .fchip .fcount { font-size: 10px; color: var(--ash); }
  .fchip .fcount:empty { display: none; }
  .dropzone { display: block; border: 1.5px dashed rgba(201,148,58,.35); border-radius: 10px; padding: 18px 12px; text-align: center; cursor: pointer; transition: all .15s; background: rgba(201,148,58,.03); }
  .dropzone:hover, .dropzone.over { border-color: var(--gold); background: rgba(201,148,58,.09); }
  .dropzone input { display: none; }
  .dz-icon { font-size: 20px; color: var(--gold-light); }
  .dz-text { font-size: 12.5px; color: #ddd; margin-top: 4px; }
  .dz-sub { font-size: 10.5px; color: var(--ash); margin-top: 3px; }
  .up-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 10px 0 4px; }
  .up-row select { background: var(--onyx-3); border: 1px solid var(--border); color: #e0e0e0; padding: 6px 8px; border-radius: 6px; font-family: inherit; font-size: 12px; }
  .up-line { display: flex; justify-content: space-between; gap: 8px; font-size: 11.5px; color: var(--ash-light); padding: 5px 0; }
  .up-line span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .up-st { white-space: nowrap; color: var(--ash); }
  .file-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .file-row:last-child { border-bottom: none; }
  .file-ext { flex-shrink: 0; width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; background: var(--onyx-3); color: var(--ash-light); border: 1px solid var(--border); }
  .file-ext.ext-pdf { color: #f87171; border-color: rgba(248,113,113,.3); }
  .file-ext.ext-img { color: #60a5fa; border-color: rgba(96,165,250,.3); }
  .file-ext.ext-doc { color: #93c5fd; border-color: rgba(147,197,253,.3); }
  .file-ext.ext-xls { color: #34d399; border-color: rgba(52,211,153,.3); }
  .file-meta { flex: 1; min-width: 0; }
  .file-name { font-size: 12.5px; color: #e6e6e6; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-sub { font-size: 10.5px; color: var(--ash); margin-top: 2px; }
  .file-acts { display: flex; gap: 4px; flex-shrink: 0; }
  .file-acts button { background: var(--onyx-3); border: 1px solid var(--border); color: var(--ash-light); width: 28px; height: 28px; border-radius: 6px; cursor: pointer; font-size: 12px; }
  .file-acts button:hover { color: #fff; border-color: rgba(201,148,58,.4); }
  .file-acts button.del:hover { color: #f87171; border-color: rgba(248,113,113,.4); }
  .files-empty { font-size: 12px; color: var(--ash); padding: 10px 0 2px; text-align: center; }

  .loading { text-align: center; padding: 48px; color: var(--ash); }
  .loading-spinner { width: 24px; height: 24px; border: 1px solid var(--border-gold); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 16px; }
  @keyframes spin { to { transform: rotate(360deg); } }

/* ═════════ PITTAHAYA LUXURY SKIN (ficha) ═════════ */
:root{--magenta:#e83487;--glass-b:rgba(232,201,122,.12)}
body{background:#070608!important}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60vw 50vh at 85% -10%,rgba(232,52,135,.16),transparent 60%),radial-gradient(55vw 55vh at 10% 110%,rgba(201,148,58,.14),transparent 60%),#070608}
.sidebar{background:linear-gradient(180deg,rgba(16,13,16,.92),rgba(10,9,11,.96))!important;backdrop-filter:blur(18px);border-right:1px solid var(--glass-b)!important}
.sidebar-brand .lux-mark{width:42px;height:42px;display:block;margin-bottom:10px;filter:drop-shadow(0 6px 18px rgba(232,52,135,.45));animation:luxFloat 6s ease-in-out infinite}
.sidebar-logo{font-family:'Cormorant Garamond',serif!important;font-size:26px!important;font-weight:600;background:linear-gradient(100deg,#f6e3b4,#e8c97a 40%,#e83487);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.nav-item{border-radius:10px!important}
.nav-item:hover{background:rgba(232,201,122,.06)!important;color:#f3e6c6!important}
.lead-name-header{font-family:'Cormorant Garamond',serif!important;font-size:46px!important;font-weight:400!important;background:linear-gradient(100deg,#fbf1d8,#e8c97a 55%,#e83487);-webkit-background-clip:text;background-clip:text;color:transparent!important}
.card{background:linear-gradient(160deg,rgba(28,24,30,.72),rgba(14,12,15,.72))!important;backdrop-filter:blur(14px);border:1px solid var(--glass-b)!important;border-radius:18px!important;box-shadow:0 0 0 1px rgba(232,201,122,.06),0 18px 50px -24px rgba(201,148,58,.35);transition:transform .3s,box-shadow .3s;animation:luxIn .6s cubic-bezier(.2,.7,.2,1) both}
.card:hover{box-shadow:0 0 0 1px rgba(232,201,122,.2),0 24px 60px -26px rgba(232,52,135,.4)}
.lead-grid .card:nth-child(2){animation-delay:.06s}.lead-grid .card:nth-child(3){animation-delay:.12s}.lead-grid .card:nth-child(4){animation-delay:.18s}
.card-title{letter-spacing:.28em!important;color:#a8977a!important;border-bottom-color:var(--glass-b)!important}
.save-btn,.add-btn{background:linear-gradient(120deg,#e8c97a,#c9943a 55%,#b87a2a)!important;color:#1a1004!important;border:none!important;border-radius:999px!important;font-weight:600!important;box-shadow:0 8px 24px -10px rgba(201,148,58,.7);transition:all .2s!important}
.save-btn:hover,.add-btn:hover{box-shadow:0 12px 30px -10px rgba(232,52,135,.55)!important;transform:translateY(-1px)}
.btn{border-radius:999px!important;border:1px solid var(--glass-b)!important;transition:all .2s!important}
.btn:hover{border-color:rgba(232,201,122,.45)!important;color:#f6e3b4!important}
input,select,textarea{border-radius:10px!important}
input:focus,select:focus,textarea:focus{border-color:rgba(232,201,122,.5)!important;box-shadow:0 0 0 3px rgba(201,148,58,.12)!important;outline:none}
.stage-bar{border-radius:999px!important;overflow:hidden}
.demo-banner{position:sticky;top:0;z-index:60;margin:0 0 16px;padding:9px 16px;border-radius:999px;font-size:11px;letter-spacing:.08em;text-align:center;color:#1a1004;background:linear-gradient(90deg,#e8c97a,#e83487)}
@keyframes luxIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes luxFloat{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-7px) rotate(2deg)}}
::-webkit-scrollbar{width:9px}::-webkit-scrollbar-thumb{background:linear-gradient(#c9943a,#e83487);border-radius:9px}::-webkit-scrollbar-track{background:#0b0a0c}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.nav-toggle{display:none}
@media (max-width:900px){
 .sidebar{transform:translateX(-100%);transition:transform .3s ease;z-index:150!important}
 body.nav-open .sidebar{transform:none}
 .nav-toggle{display:flex;position:fixed;top:14px;left:14px;z-index:200;width:42px;height:42px;border-radius:12px;align-items:center;justify-content:center;background:rgba(20,16,20,.9);border:1px solid rgba(232,201,122,.3);color:#f6e3b4;font-size:18px;cursor:pointer}
 .main{margin-left:0!important;padding-top:68px!important}
 .lead-grid{grid-template-columns:1fr!important}
}

/* ══ Ficha de perfil premium ══ */
.back-link{display:inline-flex;margin-bottom:14px;color:#a8977a!important;font-size:11px;letter-spacing:.14em;text-transform:uppercase;text-decoration:none}
.back-link:hover{color:#f6e3b4!important}
.ph-hero{--mx:50%;--my:50%;position:relative;overflow:hidden;border-radius:26px;padding:30px 32px 22px;margin-bottom:22px;
 background:linear-gradient(125deg,rgba(201,148,58,.15),rgba(232,52,135,.10) 55%,rgba(16,13,17,.75)),rgba(14,12,15,.8);
 border:1px solid rgba(232,201,122,.2);box-shadow:0 40px 90px -45px rgba(232,52,135,.6);animation:luxIn .7s cubic-bezier(.2,.7,.2,1) both}
.ph-hero::before{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(420px circle at var(--mx) var(--my),rgba(232,201,122,.12),transparent 65%)}
.ph-glow{position:absolute;width:460px;height:460px;right:-140px;top:-220px;border-radius:50%;background:radial-gradient(circle,rgba(232,52,135,.32),transparent 65%);pointer-events:none;animation:phPulse 9s ease-in-out infinite}
@keyframes phPulse{50%{transform:scale(1.1);opacity:.8}}
.ph-top{position:relative;display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.ph-avatar{position:relative;width:96px;height:96px;border-radius:50%;flex-shrink:0;padding:3px;background:conic-gradient(from 200deg,#e8c97a,#e83487,#c9943a,#e8c97a);animation:phSpin 10s linear infinite}
.ph-avatar span{display:flex;align-items:center;justify-content:center;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 30% 25%,#2a2128,#0f0c10);
 font-family:'Cormorant Garamond',serif;font-size:36px;color:#fbf1d8;animation:phSpin 10s linear infinite reverse}
.ph-flag{position:absolute;right:-2px;bottom:2px;font-style:normal;font-size:20px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.6))}
@keyframes phSpin{to{transform:rotate(360deg)}}
.ph-id{flex:1;min-width:240px}
.ph-eyebrow{display:flex;align-items:center;gap:8px;font-size:9.5px;letter-spacing:.3em;text-transform:uppercase;color:#d8b77a}
.ph-live{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 10px #34d399;animation:phBlink 1.8s infinite}
@keyframes phBlink{50%{opacity:.3}}
.ph-hero .lead-name-header{font-size:48px!important;line-height:1.05;margin:6px 0 4px}
.ph-company{font-size:14px;color:#e6d6b5}.ph-company span{color:#a8977a}
.ph-chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.ph-chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:4px 11px;border-radius:999px;background:rgba(255,255,255,.04);border:1px solid rgba(232,201,122,.14);color:#cdbf9f}
.ph-stats{display:flex;gap:22px;align-items:center}
.ph-gauge{position:relative;width:104px;height:104px}
.ph-gauge svg{width:100%;height:100%;transform:rotate(-90deg)}
.ph-gauge .bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:7}
.ph-gauge .fg{fill:none;stroke:url(#phG);stroke-width:7;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(232,52,135,.5))}
.ph-gauge-v{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ph-gauge-v b{font-family:'Cormorant Garamond',serif;font-size:30px;color:#fbf1d8;font-weight:500;line-height:1}
.ph-gauge-v small{position:absolute;top:34px;right:22px;font-size:11px;color:#d8b77a}
.ph-gauge-v span{font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:#a8977a;margin-top:2px}
.ph-money{min-width:170px}
.ph-money>span{display:block;font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:#a8977a}
.ph-money b{font-family:'Cormorant Garamond',serif;font-size:38px;font-weight:500;background:linear-gradient(100deg,#fbf1d8,#e8c97a);-webkit-background-clip:text;background-clip:text;color:transparent}
.ph-money small{font-size:11px;color:#a8977a;margin-left:6px}
.ph-paid{height:5px;border-radius:5px;background:rgba(255,255,255,.07);margin-top:8px;overflow:hidden}
.ph-paid div{height:100%;border-radius:5px;background:linear-gradient(90deg,#e8c97a,#34d399);animation:phGrow 1.4s cubic-bezier(.4,0,.2,1) both}
@keyframes phGrow{from{width:0}}
.ph-money em{font-style:normal;font-size:10.5px;color:#8ee6bf}
.ph-stepper{position:relative;display:flex;align-items:center;margin:26px 0 18px;padding:14px 18px;border-radius:18px;background:rgba(8,6,9,.45);border:1px solid rgba(232,201,122,.1)}
.ph-step{display:flex;flex-direction:column;align-items:center;gap:6px;background:none;border:none;cursor:pointer;font-family:inherit;padding:0;min-width:64px}
.ph-dot{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;color:#8b7d65;border:1.5px solid rgba(232,201,122,.22);background:#120f13;transition:all .3s}
.ph-lbl{font-size:10px;letter-spacing:.06em;color:#8b7d65;white-space:nowrap}
.ph-step:hover .ph-dot{border-color:#e8c97a;color:#fbf1d8;transform:scale(1.1)}
.ph-step.done .ph-dot{background:linear-gradient(135deg,#e8c97a,#c9943a);color:#1a1004;border:none}
.ph-step.done .ph-lbl{color:#cdbf9f}
.ph-step.cur .ph-dot{background:linear-gradient(135deg,#e8c97a,#e83487);color:#fff;border:none;box-shadow:0 0 0 6px rgba(232,52,135,.18),0 0 24px rgba(232,52,135,.55);animation:phRing 2s infinite}
.ph-step.cur .ph-lbl{color:#fbf1d8;font-weight:600}
@keyframes phRing{50%{box-shadow:0 0 0 10px rgba(232,52,135,.06),0 0 30px rgba(232,52,135,.7)}}
.ph-line{flex:1;height:2px;margin:0 4px 18px;background:linear-gradient(90deg,rgba(232,201,122,.35),rgba(232,201,122,.1));border-radius:2px}
.ph-stepper.is-lost{opacity:.5}

 color:#e6d6b5;background:rgba(255,255,255,.035);border:1px solid rgba(232,201,122,.16);transition:all .2s}

function t(k){ return (I18N[LANG] && I18N[LANG][k] !== undefined) ? I18N[LANG][k] : (I18N.es[k] !== undefined ? I18N.es[k] : k); }
function applySidebarI18n(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el => { const k = el.getAttribute('data-i18n'); if (I18N[LANG][k] !== undefined) el.textContent = I18N[LANG][k]; });
  const lb = document.getElementById('langBtn'); if (lb) lb.textContent = I18N[LANG].lang_btn;
}
function toggleLang(){
  LANG = LANG === 'es' ? 'en' : 'es';
  try { localStorage.setItem('crm_lang', LANG); } catch {}
  applySidebarI18n();
  if (leadData) { renderPage(leadData.lead, leadData.notes, leadData.tasks); animateProfileHero(); loadLeadInvoices(); wireDropzone(); renderLeadFiles(); }
}

async function loadCrmConfig() {
  const res = await fetch('/api/crm-config', { headers: { 'Accept': 'application/json' } });
  const config = await res.json().catch(() => ({}));
  if (!res.ok || !config.supabaseUrl || !config.supabaseAnonKey) {
    throw new Error(config.error || 'CRM no configurado en Vercel.');
  }
  return config;
}

async function init() {
  const config = await loadCrmConfig();
  const { createClient } = supabase;
  sb = createClient(config.supabaseUrl, config.supabaseAnonKey);

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.href = '/crm/login.html'; return; }
  authToken = session.access_token;
  const params = new URLSearchParams(location.search);
  leadId = params.get('id');
  if (!leadId) { window.location.href = '/crm/index.html'; return; }
  applySidebarI18n();
  await loadLead();
}

async function logout() {
  await sb.auth.signOut();
  window.location.href = '/crm/login.html';
}

async function api(params, method = 'GET', body = null) {
  if (window.CRM_DEMO && CRM_DEMO.isOn() && (CRM_DEMO.isDemoId(leadId) && (!params.id || CRM_DEMO.isDemoId(params.id)))) return CRM_DEMO.respond(params, method, body);
  const url = API_BASE + '?' + new URLSearchParams(params);
  const opts = { method, headers: { 'Authorization': `Bearer ${authToken}`, 'Content-Type': 'application/json' } };
  if (body) opts.body = JSON.stringify(body);
  const res = await fetch(url, opts);
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function loadLead() {
  try {
    const data = await api({ action: 'lead', id: leadId });
    leadData = data;
    renderPage(data.lead, data.notes, data.tasks);
    animateProfileHero();
    if (window.CRM_DEMO && CRM_DEMO.isOn() && CRM_DEMO.isDemoId(leadId)) document.getElementById('main').insertAdjacentHTML('afterbegin', `<div class="demo-banner">🎬 <b>${LANG === 'en' ? 'DEMO MODE' : 'MODO DEMO'}</b> · ${LANG === 'en' ? 'Fictional data' : 'Datos ficticios'}</div>`);
    loadLeadInvoices();
    wireDropzone();
    loadLeadFiles();
  } catch(e) {
    document.getElementById('main').innerHTML = `<div class="loading">${t('load_error')}<a href="/crm/index.html" style="color:var(--gold)">${t('back_dash')}</a></div>`;
  }
}

async function loadLeadInvoices() {
  const el = document.getElementById('leadInvoices');
  if (!el) return;
  const fmt = (n) => '$' + (Number(n) || 0).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const DOC = LANG === 'en' ? { factura: 'Invoice', recibo: 'Receipt' } : { factura: 'Factura', recibo: 'Recibo' };
  try {
    const { invoices } = await api({ action: 'invoices', lead_id: leadId });
    const rows = invoices || [];
    if (!rows.length) { el.innerHTML = `<div style="font-size:12px;color:var(--ash);padding:4px 0">${t('invoices_empty')}</div>`; return; }
    el.innerHTML = rows.map(inv => {
      const bal = Math.max(0, (Number(inv.total) || 0) - (Number(inv.amount_paid) || 0));
      const flag = inv.country === 'ca' ? '🇨🇦' : '🇪🇨';
      return `<a href="/crm/invoice.html?invoice=${inv.id}" style="display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);text-decoration:none;color:#ddd;font-size:12.5px">
        <span>${flag} <b style="color:var(--gold-light)">${esc(inv.number || '—')}</b> · ${DOC[inv.doc_type] || DOC.factura}<br><span style="color:var(--ash);font-size:11px">${(inv.issue_date||'').slice(0,10)}</span></span>
        <span style="text-align:right;white-space:nowrap">${fmt(inv.total)} ${esc(inv.currency||'')}<br><span style="font-size:11px;color:${bal<=0.001?'#34d399':'#fbbf24'}">${bal<=0.001?t('inv_paid'):t('inv_balance')+' '+fmt(bal)}</span></span>
      </a>`;
    }).join('');
  } catch (e) {
    el.innerHTML = `<div style="font-size:12px;color:var(--ash)">${esc(String(e.message||e)).slice(0,80)}</div>`;
  }
}

// ── Documentos del cliente (bóveda privada en Supabase Storage) ──
const FILE_CATS = ['invoice', 'contract', 'proposal', 'receipt', 'id', 'other'];
const FILE_ICON = { invoice: '🧾', contract: '📝', proposal: '📊', receipt: '💳', id: '🪪', other: '📎' };
const FILE_MAX = 20 * 1024 * 1024;
let leadFiles = [], fileFilter = 'all';

function fmtSize(b) { b = Number(b) || 0; return b < 1024 ? b + ' B' : b < 1048576 ? (b / 1024).toFixed(0) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
function fileExtIcon(name) {
  const e = (String(name).split('.').pop() || '').toLowerCase();
  if (e === 'pdf') return 'PDF';
  if (['png','jpg','jpeg','webp','heic','gif'].includes(e)) return 'IMG';
  if (['doc','docx'].includes(e)) return 'DOC';
  if (['xls','xlsx','csv'].includes(e)) return 'XLS';
  if (['ppt','pptx'].includes(e)) return 'PPT';
  return e.slice(0, 3).toUpperCase() || 'FILE';
}

function setFileFilter(c) {
  fileFilter = c;
  document.querySelectorAll('#fileFilter .fchip').forEach(b => b.classList.toggle('on', b.dataset.cat === c));
  renderLeadFiles();
}

function renderLeadFiles() {
  const el = document.getElementById('leadFiles');
  if (!el) return;
  // contadores por categoría en los chips
  document.querySelectorAll('#fileFilter .fchip').forEach(b => {
    const c = b.dataset.cat, n = c === 'all' ? leadFiles.length : leadFiles.filter(f => f.category === c).length;
    let s = b.querySelector('.fcount'); if (!s) { s = document.createElement('span'); s.className = 'fcount'; b.appendChild(s); }
    s.textContent = n ? n : '';
  });
  const rows = fileFilter === 'all' ? leadFiles : leadFiles.filter(f => f.category === fileFilter);
  if (!rows.length) { el.innerHTML = `<div class="files-empty">${leadFiles.length ? t('files_none_cat') : t('files_empty')}</div>`; return; }
  const locale = LANG === 'en' ? 'en-CA' : 'es-EC';
  el.innerHTML = rows.map((f, i) => `
    <div class="file-row">
      <div class="file-ext ext-${fileExtIcon(f.name).toLowerCase()}">${fileExtIcon(f.name)}</div>
      <div class="file-meta">
        <div class="file-name" title="${esc(f.name)}">${esc(f.name)}</div>

async function loadLeadFiles() {

    leadFiles = files || [];
    renderLeadFiles();

    el.innerHTML = `<div class="files-empty">${t('files_err')}: ${esc(String(e.message || e)).slice(0, 90)}</div>`;
  }

async function uploadFiles(fileList) {
  const files = Array.from(fileList || []);
  if (!files.length) return;
  if (window.CRM_DEMO && CRM_DEMO.isOn()) { toast(LANG === 'en' ? 'Demo mode: files are not saved' : 'Modo demo: los archivos no se guardan'); return; }
  const cat = document.getElementById('fileCat').value;
  const prog = document.getElementById('uploadProgress');
  let ok = 0;
  for (const file of files) {
    const line = document.createElement('div');
    line.className = 'up-line';
    line.innerHTML = `<span>${esc(file.name)}</span><span class="up-st">${t('files_uploading')}</span>`;
    prog.appendChild(line);
    const st = line.querySelector('.up-st');
    try {
      if (file.size > FILE_MAX) throw new Error(t('files_too_big'));
      const { signedUrl } = await api({ action: 'file-upload' }, 'POST', { lead_id: leadId, category: cat, name: file.name, size: file.size });
      const r = await fetch(signedUrl, { method: 'PUT', headers: { 'Content-Type': file.type || 'application/octet-stream', 'x-upsert': 'false' }, body: file });
      if (!r.ok) throw new Error((await r.text()).slice(0, 120) || 'HTTP ' + r.status);
      st.textContent = '✓'; st.style.color = '#34d399'; ok++;
    } catch (e) {
      let msg = String(e.message || e); try { msg = JSON.parse(msg).error || msg; } catch {}
      st.textContent = '✕ ' + msg.slice(0, 70); st.style.color = '#f87171';
    }
  }
  document.getElementById('fileInput').value = '';
  if (ok) { toast(ok + ' ' + t('files_uploaded')); await loadLeadFiles(); }
  setTimeout(() => { prog.querySelectorAll('.up-line').forEach(l => { if (l.querySelector('.up-st').textContent === '✓') l.remove(); }); }, 2500);
}

async function openFile(path, download) {
  if (window.CRM_DEMO && CRM_DEMO.isOn()) { toast(LANG === 'en' ? 'Demo document' : 'Documento de demostración'); return; }
  // Abrimos la pestaña YA (antes del await) para que el navegador no la bloquee.
  const win = download ? null : window.open('about:blank', '_blank');
  try {
    const { url } = await api({ action: 'file-url', lead_id: leadId, path, dl: download ? '1' : '0' });
    if (win) { win.opener = null; win.location.href = url; } else { window.location.href = url; }
  } catch (e) { if (win) win.close(); toast(t('files_err'), true); }
}

async function deleteFile(path, name) {
  if (!confirm(t('files_confirm_del') + '\n\n' + name)) return;
  try {
    await api({ action: 'file', lead_id: leadId, path }, 'DELETE', { lead_id: leadId, path });
    toast(t('files_deleted'));
    await loadLeadFiles();
  } catch (e) { toast(t('files_err'), true); }
}

function wireDropzone() {
  const dz = document.getElementById('dropzone');
  if (!dz || dz.dataset.wired) return;
  dz.dataset.wired = '1';
  ['dragenter', 'dragover'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove('over'); }));
  dz.addEventListener('drop', e => uploadFiles(e.dataTransfer.files));
}

const STAGES = ['new', 'contacted', 'qualified', 'proposal_sent', 'won'];
function closeProbability(l) {
  if (l.status === 'won') return 100;
  if (l.status === 'lost') return 0;
  let p = { new: 18, contacted: 32, qualified: 52, proposal_sent: 70 }[l.status] || 20;
  p += { hot: 12, warm: 4, cold: -8 }[l.priority] || 0;
  if (Number(l.deal_value) > 0) p += 4;
  const days = (Date.now() - new Date(l.created_at)) / 864e5;
  if (days > 21) p -= 8;
  return Math.max(3, Math.min(97, Math.round(p)));
}

function phConfetti() {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c = document.createElement('canvas'); c.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:9999'; document.body.appendChild(c);
  const x = c.getContext('2d'); c.width = innerWidth; c.height = innerHeight;
  const cols = ['#e8c97a', '#f6e3b4', '#c9943a', '#e83487', '#fff'];
  const ps = Array.from({ length: 140 }, () => ({ x: innerWidth / 2, y: innerHeight * .3, vx: (Math.random() - .5) * 15, vy: -Math.random() * 13 - 4, s: Math.random() * 6 + 3, r: 0, vr: (Math.random() - .5) * .3, c: cols[Math.random() * 5 | 0] }));
  let k = 0; (function f() { x.clearRect(0, 0, c.width, c.height); ps.forEach(p => { p.vy += .35; p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.globalAlpha = Math.max(0, 1 - k / 160); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }); if (++k < 170) requestAnimationFrame(f); else c.remove(); })();
}

          <div class="select-row" style="margin-top:12px">

            </div>
          </div>
          <div class="select-row" style="margin-top:12px">
            <div class="select-group">
              <label>${t('tax_charged')}</label>
              <input type="number" id="fTax" min="0" step="any" value="${lead.tax_amount != null ? lead.tax_amount : ''}" placeholder="0">
            </div>
            <div class="select-group">

          </div>

            <label>${t('project_stage')}</label>
            <select id="fStage">
              <option value=""           ${!lead.project_stage?'selected':''}>${t('stage_none')}</option>
              <option value="diagnosis"  ${lead.project_stage==='diagnosis'?'selected':''}>${t('stg_diagnosis')}</option>
              <option value="design"     ${lead.project_stage==='design'?'selected':''}>${t('stg_design')}</option>
              <option value="review"     ${lead.project_stage==='review'?'selected':''}>${t('stg_review')}</option>
              <option value="launch"     ${lead.project_stage==='launch'?'selected':''}>${t('stg_launch')}</option>
              <option value="delivered"  ${lead.project_stage==='delivered'?'selected':''}>${t('stg_delivered')}</option>

          </div>
          <div class="select-row" style="margin-top:12px">
            <div class="select-group">
              <label>${t('due_date')}</label>
              <input type="date" id="fDue" value="${(lead.payment_due || '').slice(0,10)}">
            </div>
            <div class="select-group">
              <label>${t('next_followup')}</label>
              <input type="date" id="fFollowup" value="${(lead.next_followup || '').slice(0,10)}">
            </div>
          </div>
          <button class="save-btn" id="saveFinanceBtn" onclick="saveFinance()">${t('save_finance')}</button>
        </div>

        <!-- Asistente de seguimiento (IA + automatización) -->
        <div class="card" id="aiCard">
          <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span>${t('ai_title')}</span>
            <span id="aiBadge" style="font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);border:1px solid var(--border);border-radius:20px;padding:2px 8px">IA</span>
          </div>
          <div id="aiBody">
            <p style="font-size:12.5px;color:var(--ash);line-height:1.5;margin-bottom:12px">${t('ai_intro')}</p>
            <button class="save-btn" id="aiGenBtn" style="margin-top:0" onclick="generateFollowup()">${t('ai_generate')}</button>

        <!-- Facturas de este cliente -->

          <div class="card-title">${t('invoices_title')}</div>
          <div id="leadInvoices"><div class="loading" style="padding:6px 0;font-size:12px;color:var(--ash)">${t('invoices_loading')}</div></div>

        <!-- Documentos del cliente (bóveda privada) -->
        <div class="card" id="filesCard">
          <div class="card-title" style="display:flex;align-items:center;justify-content:space-between;gap:8px">
            <span>${t('files_title')}</span>
            <span class="vault-badge">🔒 ${t('files_private')}</span>
          </div>
          <div class="file-chips" id="fileFilter">
            ${['all', ...FILE_CATS].map(c => `<button class="fchip ${c === 'all' ? 'on' : ''}" data-cat="${c}" onclick="setFileFilter('${c}')">${c === 'all' ? t('fc_all') : FILE_ICON[c] + ' ' + t('fc_' + c)}</button>`).join('')}

          <label class="dropzone" id="dropzone">
            <input type="file" id="fileInput" multiple accept=".pdf,.png,.jpg,.jpeg,.webp,.heic,.gif,.doc,.docx,.xls,.xlsx,.csv,.txt,.ppt,.pptx,.zip" onchange="uploadFiles(this.files)">
            <div class="dz-icon">⬆</div>
            <div class="dz-text">${t('files_drop')}</div>
            <div class="dz-sub">PDF, Word, Excel, imágenes · máx. 20 MB</div>
          </label>
          <div class="up-row">
            <span style="font-size:11px;color:var(--ash)">${t('files_as')}</span>
            <select id="fileCat">${FILE_CATS.map(c => `<option value="${c}">${FILE_ICON[c]} ${t('fc_' + c)}</option>`).join('')}</select>
          </div>
          <div id="uploadProgress"></div>
          <div id="leadFiles"><div style="padding:6px 0;font-size:12px;color:var(--ash)">${t('files_loading')}</div></div>
        </div>

        <!-- Tasks -->
        <div class="card">
          <div class="card-title">${t('tasks_title')}</div>
          <div id="tasksList">
            ${renderTasks(tasks)}

            <input type="text" id="newTaskTitle" placeholder="${t('task_ph')}">
            <input type="date" id="newTaskDate">
            <button class="add-btn" onclick="addTask()">${t('task_add')}</button>
          </div>
        </div>

        <!-- Quick actions -->
        <div class="card">
          <div class="card-title">${t('quick')}</div>
          <div style="display:flex; flex-direction:column; gap:10px;">
            <a href="mailto:${esc(lead.email)}?subject=${LANG==='en'?'Pittahaya proposal for':'Propuesta Pittahaya para'} ${esc(lead.company || lead.name)}" class="btn" style="justify-content:center; width:100%;">
              ${t('send_proposal')}
            </a>
            <a href="https://wa.me/${lead.phone?.replace(/\D/g,'')}?text=${LANG==='en'?encodeURIComponent('Hi '+lead.name.split(' ')[0]+', reaching out from Pittahaya...'):encodeURIComponent('Hola '+lead.name.split(' ')[0]+', te contacto de Pittahaya...')}" class="btn" target="_blank" rel="noopener noreferrer" style="justify-content:center; width:100%; ${!lead.phone?'opacity:0.4;pointer-events:none':''}">
              ${t('whatsapp')}

      </div>
    </div>
  `;
}

function renderNotes(notes) {
  if (!notes || notes.length === 0) return `<div class="empty-state">${t('no_notes')}</div>`;
  return notes.map(n => `
    <div class="note-item" id="note-${n.id}">
      <div class="note-header">
        <span class="note-author">${esc(n.author)}</span>
        <div style="display:flex;align-items:center;gap:8px">
          <span class="note-date">${formatDateTime(n.created_at)}</span>
          <button class="note-delete" onclick="deleteNote('${n.id}')" title="Eliminar nota">✕</button>
        </div>
      </div>
      <div class="note-content">${esc(n.content)}</div>
    </div>
  `).join('');
}

function renderTasks(tasks) {
  if (!tasks || tasks.length === 0) return `<div class="empty-state">${t('no_tasks')}</div>`;
  return tasks.map(t => {
    const isOverdue = t.due_date && !t.completed && new Date(t.due_date) < new Date();
    return `
    <div class="task-item" id="task-${t.id}">
      <input type="checkbox" class="task-check" ${t.completed?'checked':''} onchange="toggleTask('${t.id}', this.checked)">
      <div class="task-body">
        <div class="task-title ${t.completed?'done':''}">${esc(t.title)}</div>
        ${t.due_date ? `<div class="task-due ${isOverdue?'overdue':''}">${isOverdue?'⚠ ':''} ${I18N[LANG].task_due} ${formatDate(t.due_date)}</div>` : ''}
      </div>
      <button class="task-delete" onclick="deleteTask('${t.id}')" title="Eliminar tarea">✕</button>
    </div>`;
  }).join('');
}

// ── Actions ───────────────────────────────────────────────────
async function deleteLead() {
  if (!confirm(t('c_del_lead'))) return;
  try {
    await api({ action: 'lead', id: leadId }, 'DELETE');
    window.location.href = '/crm/index.html';
  } catch (e) { toast(t('t_error') + (e.message || e), true); }
}

async function saveStatus() {
  const btn = document.getElementById('saveStatusBtn');
  btn.disabled = true; btn.textContent = t('t_saving');
  try {
    await api({ action: 'lead', id: leadId }, 'PATCH', {
      status:   document.getElementById('selectStatus').value,
      priority: document.getElementById('selectPriority').value,
    });
    toast(t('t_status'));
  } catch(e) { toast(t('t_error') + e.message, true); }
  btn.disabled = false; btn.textContent = t('save_changes');
}


function editEmailInline() {
  const box = document.getElementById('emailVal');
  const cur = (leadData && leadData.lead.email) || '';
  box.innerHTML = `<div class="email-inline"><input type="email" id="emailInline" value="${esc(cur)}" maxlength="200">
    <button onclick="saveEmailInline()">✓</button><button class="x" onclick="renderPage(leadData.lead, leadData.notes, leadData.tasks); animateProfileHero(); loadLeadInvoices(); wireDropzone(); renderLeadFiles();">✕</button></div>`;
  const i = document.getElementById('emailInline'); i.focus(); i.select();
  i.onkeydown = e => { if (e.key === 'Enter') saveEmailInline(); if (e.key === 'Escape') i.nextElementSibling.nextElementSibling.click(); };
}
async function saveEmailInline() {
  const email = document.getElementById('emailInline').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { toast(LANG === 'en' ? 'Invalid email' : 'Correo inválido', true); return; }
  try {
    await api({ action: 'lead', id: leadId }, 'PATCH', { email });
    leadData.lead.email = email;
    renderPage(leadData.lead, leadData.notes, leadData.tasks); animateProfileHero(); loadLeadInvoices(); wireDropzone(); renderLeadFiles();
    toast(LANG === 'en' ? 'Email updated' : 'Correo actualizado');
  } catch (e) { toast(t('t_error') + (e.message || e), true); }
}
function useTestEmail() {
  const n = (document.getElementById('cName').value || 'cliente').toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]+/g, '').slice(0, 12) || 'cliente';
  document.getElementById('cEmail').value = 'test+' + n + '@pittahaya.com';
  document.getElementById('cPhone').value = '+593 99 000 0000';
  toast(LANG === 'en' ? 'Test email set — press Save' : 'Correo de prueba listo — pulsa Guardar');
}
async function saveContact() {
  const btn = document.getElementById('saveContactBtn');
  btn.disabled = true; btn.textContent = t('t_saving');
  try {
    const body = {
      name:   document.getElementById('cName').value.trim(),
      email:  document.getElementById('cEmail').value.trim(),
      phone:  document.getElementById('cPhone').value,
      social: document.getElementById('cSocial').value
    };
    await api({ action: 'lead', id: leadId }, 'PATCH', body);
    if (leadData) Object.assign(leadData.lead, body);
    // refresca la ficha para que el encabezado muestre el nuevo nombre/correo
    if (leadData) { renderPage(leadData.lead, leadData.notes, leadData.tasks); animateProfileHero(); loadLeadInvoices(); wireDropzone(); renderLeadFiles(); }
    toast(t('t_contact'));
  } catch (e) { toast(t('t_error') + (e.message || e), true); }
  btn.disabled = false; btn.textContent = t('save_contact');
}

async function saveFinance() {
  const btn = document.getElementById('saveFinanceBtn');
  btn.disabled = true; btn.textContent = t('t_saving');
  try {
    await api({ action: 'lead', id: leadId }, 'PATCH', {
      deal_value:     document.getElementById('fDeal').value || 0,
      amount_paid:    document.getElementById('fPaid').value || 0,
      country:        document.getElementById('fCountry').value,
      tax_amount:     document.getElementById('fTax').value || 0,
      withholding:    document.getElementById('fWithholding').value || 0,
      payment_status: document.getElementById('fPayment').value,
      project_stage:  document.getElementById('fStage').value,
      payment_due:    document.getElementById('fDue').value || '',
      next_followup:  document.getElementById('fFollowup').value || ''
    });
    toast(t('t_finance'));
    setTimeout(() => loadLead(), 600); // refresh the progress bar
  } catch(e) { toast(t('t_error') + e.message, true); }
  btn.disabled = false; btn.textContent = t('save_finance');
}

async function addNote() {
  const content = document.getElementById('newNote').value.trim();
  const author  = document.getElementById('noteAuthor').value.trim() || 'Admin';
  if (!content) return;
  try {
    const { note } = await api({ action: 'note', id: leadId }, 'POST', { content, author });
    leadData.notes.unshift(note);
    document.getElementById('notesList').innerHTML = renderNotes(leadData.notes);
    document.getElementById('newNote').value = '';
    toast(t('t_note_add'));
  } catch(e) { toast(t('t_error') + e.message, true); }
}

async function deleteNote(noteId) {
  if (!confirm(t('c_del_note'))) return;
  try {
    await api({ action: 'note', id: noteId }, 'DELETE');
    leadData.notes = leadData.notes.filter(n => n.id !== noteId);
    document.getElementById('notesList').innerHTML = renderNotes(leadData.notes);
    toast(t('t_note_del'));
  } catch(e) { toast(t('t_error') + e.message, true); }
}

async function addTask() {
  const title    = document.getElementById('newTaskTitle').value.trim();
  const due_date = document.getElementById('newTaskDate').value || null;
  if (!title) return;
  try {
    const { task } = await api({ action: 'task', id: leadId }, 'POST', { title, due_date });
    leadData.tasks.push(task);
    document.getElementById('tasksList').innerHTML = renderTasks(leadData.tasks);
    document.getElementById('newTaskTitle').value = '';
    document.getElementById('newTaskDate').value  = '';
    toast(t('t_task_add'));
  } catch(e) { toast(t('t_error') + e.message, true); }
}

async function toggleTask(taskId, completed) {
  try {
    await api({ action: 'task', id: taskId }, 'PATCH', { completed });
    const task = leadData.tasks.find(t => t.id === taskId);
    if (task) { task.completed = completed; task.completed_at = completed ? new Date().toISOString() : null; }
    document.getElementById('tasksList').innerHTML = renderTasks(leadData.tasks);
  } catch(e) { toast(t('t_error') + e.message, true); }
}

async function deleteTask(taskId) {
  if (!confirm(t('c_del_task'))) return;
  try {
    await api({ action: 'task', id: taskId }, 'DELETE');
    leadData.tasks = leadData.tasks.filter(t => t.id !== taskId);
    document.getElementById('tasksList').innerHTML = renderTasks(leadData.tasks);
    toast(t('t_task_del'));
  } catch(e) { toast(t('t_error') + e.message, true); }
}

// ── Toast ─────────────────────────────────────────────────────
function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.style.borderColor = isError ? 'rgba(239,68,68,0.4)' : 'var(--border-gold)';
  el.style.color = isError ? '#f87171' : 'var(--gold-light)';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 3000);
}

// ── Helpers ───────────────────────────────────────────────────
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function statusLabel(s) {
  const es = { new:'Nuevo', contacted:'Contactado', qualified:'Calificado', proposal_sent:'Propuesta', won:'Ganado', lost:'Perdido' };
  const en = { new:'New', contacted:'Contacted', qualified:'Qualified', proposal_sent:'Proposal', won:'Won', lost:'Lost' };
  return (LANG === 'en' ? en : es)[s] || s;
}
function priorityLabel(p) {
  const es = { cold:'Frío', warm:'Tibio', hot:'Caliente' };
  const en = { cold:'Cold', warm:'Warm', hot:'Hot' };
  return (LANG === 'en' ? en : es)[p] || p;
}
function formatDateTime(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString(LANG==='en'?'en-CA':'es-EC', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function formatDate(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleDateString(LANG==='en'?'en-CA':'es-EC', { day:'2-digit', month:'short', year:'numeric' });
}

init().catch((e) => {
  document.getElementById('main').innerHTML =
    `<div class="loading">${LANG==='en'?'Error starting CRM':'Error al iniciar CRM'}: ${esc(e.message)}</div>`;
});
</script>
<script>
// Seguridad: cierre de sesión automático tras 30 min sin actividad.
(function(){
  var LIMIT=30*60*1000, last=Date.now();
  ['mousemove','keydown','click','scroll','touchstart'].forEach(function(e){addEventListener(e,function(){last=Date.now();},{passive:true});});
  setInterval(function(){
    if(Date.now()-last<LIMIT) return;
    try{ if(window.sb&&sb.auth) sb.auth.signOut(); }catch(e){}
    try{ Object.keys(localStorage).forEach(function(k){ if(/^sb-.*-auth-token$/.test(k)) localStorage.removeItem(k); }); }catch(e){}
    location.href='/crm/login.html?timeout=1';
  },30000);
})();
</script>
